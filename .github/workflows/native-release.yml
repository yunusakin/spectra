name: native-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/native-release.yml"
      - "install.sh"
      - "package.json"
      - "package-lock.json"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/templates/**"
      - "profiles/**"

permissions:
  contents: write

jobs:
  build-native:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build native archive
        run: npm run build:native --workspace packages/cli

      - name: Smoke native binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls packages/cli/dist/native/spectra-${{ matrix.target }}.tar.gz)"
          mkdir -p /tmp/spectra-native
          tar -xzf "$archive" -C /tmp/spectra-native
          /tmp/spectra-native/bin/spectra --help
          /tmp/spectra-native/bin/spectra version
          version="$(node -p "require('./packages/cli/package.json').version")"
          bash packages/cli/scripts/smoke-native.sh /tmp/spectra-native/bin/spectra "$version"
          smoke_dir="$(mktemp -d)"
          git -C "$smoke_dir" init -q
          git -C "$smoke_dir" config user.email spectra@example.test
          git -C "$smoke_dir" config user.name 'Spectra Test'
          touch "$smoke_dir/README.md"
          git -C "$smoke_dir" add README.md
          git -C "$smoke_dir" commit -qm 'initial project'
          brownfield_dir="$(mktemp -d)"
          mkdir -p "$brownfield_dir/src/test/java"
          printf 'class BalanceServiceTest {}\n' > "$brownfield_dir/src/test/java/BalanceServiceTest.java"
          /tmp/spectra-native/bin/spectra adopt "$brownfield_dir" --git-mode shared
          brownfield_status="$("$brownfield_dir/spectra/bin/spectra" status --cwd "$brownfield_dir")"
          printf '%s\n' "$brownfield_status"
          grep -F 'Spectra Project Status' <<< "$brownfield_status"
          grep -F 'Profile: lite' <<< "$brownfield_status"
          local_dir="$(mktemp -d)"
          git -C "$local_dir" init -q
          git -C "$local_dir" config user.email spectra@example.test
          git -C "$local_dir" config user.name 'Spectra Test'
          mkdir -p "$local_dir/src"
          printf 'class BalanceService {}\n' > "$local_dir/src/BalanceService.java"
          git -C "$local_dir" add src/BalanceService.java
          git -C "$local_dir" commit -qm 'initial source'
          /tmp/spectra-native/bin/spectra adopt "$local_dir" --git-mode local
          test -z "$(git -C "$local_dir" status --short)"
          git -C "$local_dir" check-ignore -q spectra/install.json
          grep -F '"gitMode": "local"' "$local_dir/spectra/install.json"

      - uses: actions/upload-artifact@v4
        with:
          name: spectra-${{ matrix.target }}
          path: |
            packages/cli/dist/native/spectra-${{ matrix.target }}.tar.gz
            packages/cli/dist/native/spectra-${{ matrix.target }}.tar.gz.sha256

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Spectra native binaries for $tag"
          gh release upload "$tag" \
            "packages/cli/dist/native/spectra-${{ matrix.target }}.tar.gz" \
            "packages/cli/dist/native/spectra-${{ matrix.target }}.tar.gz.sha256" \
            --clobber
